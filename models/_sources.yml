version: 2

sources:
  - name: google_sheets
    description: Data from user inputs
    schema: google_sheets
    tables:
    
      - name: events
        description: Event details
        columns:
          - name: event_id
            description: Unique event identifier as used by Zwift
            data_tests:
              - not_null
              - unique
    
      - name: riders
        description: Rider ids to be used
        columns:
          - name: rider_id
            description: Unique rider identifier as used by Zwift
            data_tests:
              - not_null
              - unique
    
      - name: seasons
        description: Seasons of TT relating to Zwift TT Club
        columns:
          - name: season_id
            description: Unique seasons identifier as used by Zwift TT Racing Club
            data_tests:
              - not_null
              - unique

  - name: zwift_racing
    description: Data from ZwiftRacing.app API
    schema: zwift_racing
    tables:

      - name: event_results
        description: Event details
        columns:
          - name: event_id
            description: Unique event identifier as used by Zwift
            data_tests:
              - not_null
              - unique

      - name: event_results__results
        description: Event results within the zwift_racing.event_results table
        columns:
          - name: _dlt_parent_id
            description: Identifies the event in event_results

