version: 2

models: 
  - name: int_riders
    description: Riders data from stg_riders.
    config:
      tags: ["zrapp", "intermediate", "riders"]
    columns:
      - name: rider_id
        description: Unique identifier per rider
        data_tests:
          - not_null
          - unique
      - name: rider
        description: Rider display name.
      - name: club_id
        description: Club ID.
      - name: club
        description: Club name.
      - name: velo_90_day_peak
        description: Peak vELO score during last 90 days.
      - name: velo_90_day_peak_category
        description: Category associated with velo_90_day_peak.
      - name: velo_90_day_peak_category_number
        description: Category rank associated with velo_90_day_peak.
      - name: zwift_category
        description: Zwift category (A-D).
      - name: weight_kg
        description: Rider weight in kilograms.
      - name: ftp_watts
        description: Estimated FTP in Watts.
      - name: ftp_watts_kg
        description: Estimated FTP in Watts/kg.
      - name: watts_5s
        description: Peak 5-second power output during last 90 days, in Watts.
      - name: watts_15s
        description: Peak 15-second power output during last 90 days, in Watts.
      - name: watts_30s
        description: Peak 30-second power output during last 90 days, in Watts.
      - name: watts_60s
        description: Peak 1-minute power output during last 90 days, in Watts.
      - name: watts_120s
        description: Peak 2-minute power output during last 90 days, in Watts.
      - name: watts_300s
        description: Peak 5-minute power output during last 90 days, in Watts.
      - name: watts_1200s
        description: Peak 20-minute power output during last 90 days, in Watts.
      - name: watts_kg_5s
        description: Peak 5-second power output during last 90 days, in Watts per kg.
      - name: watts_kg_15s
        description: Peak 15-second power output during last 90 days, in Watts per kg.
      - name: watts_kg_30s
        description: Peak 30-second power output during last 90 days, in Watts per kg.
      - name: watts_kg_60s
        description: Peak 1-minute power output during last 90 days, in Watts per kg.
      - name: watts_kg_120s
        description: Peak 2-minute power output during last 90 days, in Watts per kg.
      - name: watts_kg_300s
        description: Peak 5-minute power output during last 90 days, in Watts per kg.
      - name: watts_kg_1200s
        description: Peak 20-minute power output during last 90 days, in Watts per kg.
      - name: races
        description: Races completed in last 90 days.
      - name: race_wins
        description: Races won in last 90 days.
      - name: race_podiums
        description: Top three finishes in last 90 days.
      - name: race_win_rate
        description: Proportion of races won in last 90 days.
      - name: race_podium_rate
        description: Proportion of races with podium finish in last 90 days.
      - name: handicap_flat
        description: ZRapp handicap score for flat races.
      - name: handicap_rolling
        description: ZRapp handicap score for rolling races.
      - name: handicap_hilly
        description: ZRapp handicap score for hilly races.
      - name: handicap_mountainous
        description: ZRapp handicap score for mountainous races.
      - name: phenotype_sprinter
        description: ZRapp phenotype score for sprinter.
      - name: phenotype_puncheur
        description: ZRapp phenotype score for puncheur.
      - name: phenotype_pursuiter
        description: ZRapp phenotype score for pursuiter.
      - name: phenotype_climber
        description: ZRapp phenotype score for climber.
      - name: phenotype_timetrialist
        description: ZRapp phenotype score for timetrialist.
      - name: phenotype
        description: Peak phenotype (or all-rounder if narrow spread).
      - name: _dlt_load_id
        description: Timestamp of load as unix timestamp.
      - name: data_load_timestamp
        description: _dlt_load_id as a human readable timestamp.